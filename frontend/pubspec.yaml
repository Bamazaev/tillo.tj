name: tillo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.2
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/
  # Шрифтҳои бурида (лотинӣ + кириллӣ, бо ҳарфҳои тоҷикӣ) — OFL, ниг. assets/fonts/OFL-*.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: Cormorant
      fonts:
        - asset: assets/fonts/Cormorant-600.ttf
          weight: 600
