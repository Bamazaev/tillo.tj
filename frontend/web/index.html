<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tillo.tj — золото, украшения и драгоценные камни Таджикистана</title>
  <meta name="description" content="Маркетплейс золота в Таджикистане: кольца, серьги, цепи, слитки, бриллианты и бадахшанский лал. Живая цена золота в сомони.">
  <meta name="theme-color" content="#FAF7F1">
  <meta property="og:title" content="Tillo.tj — маркетплейс золота и украшений">
  <meta property="og:description" content="Золото, бриллианты и драгоценные камни от ювелиров Таджикистана.">
  <meta property="og:type" content="website">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tillo.tj">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #FAF7F1; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 60% 30%, rgba(212,175,55,.22), #FAF7F1 60%);
      transition: opacity .4s ease;
      font-family: Georgia, 'Times New Roman', serif;
    }
    #splash .logo {
      font-size: 44px; letter-spacing: 6px; font-weight: 700;
      background: linear-gradient(110deg, #6B4E0C 20%, #E2C26A 40%, #A67C1B 55%, #6B4E0C 80%);
      background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shine 2.2s linear infinite;
    }
    #splash .gem {
      width: 34px; height: 34px; transform: rotate(45deg);
      background: linear-gradient(135deg, #F6E3A1, #D4AF37 50%, #8A6A17);
      box-shadow: 0 0 40px rgba(212,175,55,.45);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes shine { from { background-position: 100% 0; } to { background-position: -150% 0; } }
    @keyframes pulse { 50% { transform: rotate(45deg) scale(.82); opacity: .7; } }
  </style>
</head>
<body>
  <div id="splash"><div class="gem"></div><div class="logo">TILLO</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
