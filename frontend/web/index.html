<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tillo.tj — золото, украшения и драгоценные камни Таджикистана</title>
  <meta name="description" content="Маркетплейс золота в Таджикистане: кольца, серьги, цепи, слитки, бриллианты и бадахшанский лал. Живая цена золота в сомони.">
  <meta name="theme-color" content="#FAF7F1">
  <meta property="og:title" content="Tillo.tj — маркетплейс золота и украшений">
  <meta property="og:description" content="Золото, бриллианты и драгоценные камни от ювелиров Таджикистана.">
  <meta property="og:type" content="website">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tillo.tj">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Ҳамаи файлҳои муҳим якбора (параллелӣ), на занҷирвор пас аз main.dart.js -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-400.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-600.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-700.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Cormorant-600.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin>

  <style>
    :root { --bg:#FAF7F1; --surface:#fff; --line:#E9DFCB; --text:#1C1710; --muted:#7B705C; --hero:linear-gradient(200deg,#F6EBD2,#FBF6EC 45%,#FAF7F1); }
    html.dark { --bg:#0A0907; --surface:#14110C; --line:#2E281C; --text:#F4EEE0; --muted:#A39A86; --hero:radial-gradient(circle at 85% 0,rgba(212,175,55,.16),transparent 60%); }
    html, body { margin:0; height:100%; background:var(--bg); }
    #sk { position:fixed; inset:0; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text); background:var(--bg); transition:opacity .35s ease; z-index:10; }
    #sk .tick { height:32px; background:#0E0C08; display:flex; align-items:center; gap:10px; padding:0 12px; font-size:11.5px; color:#A39A86; white-space:nowrap; overflow:hidden; }
    #sk .tick b { color:#F6E3A1; }
    #sk .tick i { width:7px; height:7px; border-radius:50%; background:#A39A86; display:inline-block; }
    #sk header { height:60px; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 16px; }
    #sk .logo { font-family:Georgia,"Times New Roman",serif; font-size:24px; font-weight:700; letter-spacing:3px; color:#9A7316; }
    #sk .logo small { font-size:16px; color:var(--muted); letter-spacing:0; font-weight:400; }
    #sk .gem { width:16px; height:16px; transform:rotate(45deg); background:linear-gradient(135deg,#F6E3A1,#D4AF37 50%,#8A6A17); margin-right:12px; }
    #sk .hero { background:var(--hero); padding:28px 16px 40px; max-width:1240px; margin:0 auto; box-sizing:border-box; }
    #sk .pill { display:inline-block; font-size:12px; font-weight:600; padding:5px 10px; border:1px solid var(--line); border-radius:20px; background:var(--surface); }
    #sk h1 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(46px,8vw,84px); line-height:.98; margin:18px 0 14px; font-weight:700; white-space:pre-line;
      background:linear-gradient(110deg,#6B4E0C 20%,#E2C26A 40%,#A67C1B 55%,#6B4E0C 80%); background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 2.2s linear infinite; }
    html.dark #sk h1 { background-image:linear-gradient(110deg,#9C7A1E 20%,#FFF6D8 40%,#D4AF37 55%,#9C7A1E 80%); }
    #sk p { color:var(--muted); font-size:15px; line-height:1.6; max-width:540px; margin:0 0 22px; }
    #sk .bar { height:56px; max-width:560px; border-radius:14px; background:var(--surface); border:1px solid var(--line); margin-bottom:14px; }
    #sk .btn { height:50px; max-width:560px; border-radius:14px; background:linear-gradient(110deg,#B8892A,#F6E3A1 40%,#D4AF37 60%,#8A6A17); background-size:250% 100%; animation:shine 2.2s linear infinite; }
    @keyframes shine { from { background-position:100% 0 } to { background-position:-150% 0 } }
  </style>
  <script>
    // Ранг ва забони интихобшуда — то скелет ҳам мувофиқ бошад.
    try {
      if (localStorage.getItem('flutter.dark') === 'true') document.documentElement.className = 'dark';
      var lang = (localStorage.getItem('flutter.lang') || '').replace(/"/g, '');
    } catch (e) {}
  </script>
</head>
<body>
  <div id="sk" aria-hidden="true">
    <div class="tick"><i></i>&nbsp;LIVE&nbsp;&nbsp;<span id="sk-gold">Золото 999</span>&nbsp;<b>…</b></div>
    <header><div class="gem"></div><div class="logo">TILLO<small>.tj</small></div></header>
    <div class="hero">
      <span class="pill" id="sk-badge">Маркетплейс золота №1 в Таджикистане</span>
      <h1 id="sk-title">Золото.
Украшения.
Легенда.</h1>
      <p id="sk-text">Кольца, серьги, цепи, слитки, бриллианты и бадахшанский лал — от проверенных ювелиров и частных продавцов.</p>
      <div class="bar"></div>
      <div class="btn"></div>
    </div>
  </div>
  <script>
    (function () {
      var t = {
        tg: ['Тилло 999', 'Бозори №1 тилло дар Тоҷикистон', 'Тилло.\nҶавоҳирот.\nАфсона.', 'Ангуштарин, гӯшвора, занҷир, хиштчаҳои тилло, бриллиант ва лаъли Бадахшон — аз заргарони боэътимод.'],
        en: ['Gold 999', 'Tajikistan\'s #1 gold marketplace', 'Gold.\nJewelry.\nLegend.', 'Rings, earrings, chains, bullion, diamonds and Badakhshan spinel — from trusted jewelers and private sellers.']
      }[typeof lang === 'string' ? lang : ''];
      if (t) {
        document.getElementById('sk-gold').textContent = t[0];
        document.getElementById('sk-badge').textContent = t[1];
        document.getElementById('sk-title').textContent = t[2];
        document.getElementById('sk-text').textContent = t[3];
        document.documentElement.lang = lang === 'tg' ? 'tg' : 'en';
      }
      window.addEventListener('flutter-first-frame', function () {
        var s = document.getElementById('sk');
        s.style.opacity = '0';
        setTimeout(function () { s.remove(); }, 400);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
